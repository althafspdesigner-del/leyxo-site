<script>document.documentElement.className += ' js';</script>
<style>
@font-face{font-family:Geist;src:url(/assets/fonts/Geist-Variable.woff2) format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"Geist Mono";src:url(/assets/fonts/GeistMono-Variable.woff2) format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"Readex Pro";src:url(/assets/fonts/ReadexPro-Variable.woff2) format("woff2");font-weight:160 700;font-display:swap}
:root{--bg:#0E0D0C;--raised:#1A1816;--fg:#F4F0E8;--muted:#A39C93;--sub:#8A847C;--line:#3A3632;--signal:#8B6CFF;--btn-bg:#F4F0E8;--btn-fg:#0E0D0C}
[hidden]{display:none !important}
html,body{overscroll-behavior:none}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Geist,"Readex Pro",system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-synthesis:none}
html[dir=rtl] body{font-family:"Readex Pro",Geist,system-ui,sans-serif}
a{color:var(--fg);text-decoration:none}
a:hover{color:var(--muted)}
a:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.mono{margin:0;font-family:"Geist Mono",ui-monospace,monospace;font-size:12px;line-height:18px;font-weight:500;letter-spacing:.08em}
html[dir=rtl] .mono{font-family:"Readex Pro",Geist,sans-serif;font-size:14px;line-height:22px;font-weight:400;letter-spacing:0}
.sub{color:var(--sub)}

.root{position:relative;height:100vh;height:100dvh;min-height:640px;overflow:hidden;box-sizing:border-box}

.head{position:absolute;inset-block-start:40px;inset-inline:48px;display:flex;justify-content:space-between;align-items:flex-start;gap:24px;z-index:3}
.brand{min-height:52px}
.logo{display:block;height:30px;width:auto;animation:cut 600ms cubic-bezier(.2,0,0,1) 120ms both}
.logo-ar{height:52px;animation-name:cut-ar}
@keyframes cut{from{clip-path:polygon(0 0,0 0,-21px 100%,0 100%)}to{clip-path:polygon(0 0,calc(100% + 21px) 0,100% 100%,0 100%)}}
@keyframes cut-ar{from{clip-path:polygon(0 0,0 0,-37px 100%,0 100%)}to{clip-path:polygon(0 0,calc(100% + 37px) 0,100% 100%,0 100%)}}

.stage{--fs:1;position:absolute;inset:0;perspective:3000px;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:1}
.scale{position:relative;width:0;height:0;transform-style:preserve-3d;transform:scale(var(--fs))}
.group{position:relative;width:0;height:0;transform-style:preserve-3d;transform:rotateX(48deg)}
.card{position:absolute;left:0;top:0;width:300px;height:300px;overflow:hidden;background:var(--raised);transform:translate(-50%,-50%) rotateZ(calc(var(--i) * 24deg)) translate3d(0,-160px,0) rotateY(90deg) scale(1);opacity:1;transition:transform 600ms cubic-bezier(.2,0,0,1),opacity 300ms linear;transition-delay:calc(var(--i) * 40ms)}
.js .group:not(.open) .card{transform:translate(-50%,-50%) rotateZ(0deg) translate3d(0,-160px,0) rotateY(90deg) scale(.6);opacity:0}
.card img{display:block;width:100%;height:100%;object-fit:cover;transform:rotate(270deg) scale(1.04);user-select:none;-webkit-user-drag:none}

.bottom{position:absolute;inset-inline:48px;inset-block-end:100px;display:flex;justify-content:space-between;align-items:flex-end;gap:40px;z-index:3}
.h1{margin:0;font-size:clamp(48px,5.8vw,88px);line-height:.92;font-weight:600;letter-spacing:-0.035em}
html[dir=rtl] .h1{font-size:clamp(46px,5.4vw,82px);line-height:1.18;font-weight:500;letter-spacing:0}
.line{display:block;overflow:hidden;padding-bottom:.12em;margin-bottom:-.12em}
.line > span{display:block;animation:rise 600ms cubic-bezier(.2,0,0,1) both}
@keyframes rise{from{transform:translateY(105%)}to{transform:none}}
.side{width:clamp(300px,24vw,380px)}
.form{display:flex;flex-direction:column;gap:10px}
.row{display:flex}
.input{flex:1 1 180px;min-width:0;height:52px;box-sizing:border-box;padding:0 14px;border:1px solid var(--sub);border-right:0;border-radius:0;background:transparent;color:var(--fg);font:inherit;font-size:16px;transition:border-color 160ms cubic-bezier(.2,0,0,1)}
html[dir=rtl] .input{border-right:1px solid var(--sub);border-left:0}
.input::placeholder{color:var(--sub)}
.input:hover{border-color:var(--fg)}
.input:focus{outline:2px solid var(--fg);outline-offset:2px}
.input[aria-invalid=true]{border-color:var(--fg)}
.btn{position:relative;overflow:hidden;isolation:isolate;flex:0 0 auto;height:52px;padding:0 22px;border:0;border-radius:0;background:var(--btn-bg);color:var(--btn-fg);font-family:"Geist Mono",ui-monospace,monospace;font-size:13px;font-weight:500;letter-spacing:.08em;cursor:pointer}
html[dir=rtl] .btn{font-family:"Readex Pro",Geist,sans-serif;font-size:16px;font-weight:500;letter-spacing:0}
.btn::before{content:"";position:absolute;top:0;bottom:0;left:-40px;width:calc(100% + 80px);background:var(--signal);transform:translateX(-101%) skewX(-35deg);transform-origin:bottom left;transition:transform 420ms cubic-bezier(.65,0,.35,1);z-index:-1}
.btn:hover::before,.btn:focus-visible::before{transform:translateX(0) skewX(-35deg)}
.btn:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.roll{display:block;height:18px;line-height:18px;overflow:hidden}
html[dir=rtl] .roll{height:26px;line-height:26px}
.roll > span{display:block;transition:transform 420ms cubic-bezier(.65,0,.35,1)}
.btn:hover .roll > span,.btn:focus-visible .roll > span{transform:translateY(-100%)}
.hint{margin:0;font-size:14px;line-height:20px;color:var(--sub)}
html[dir=rtl] .hint{font-size:15px;line-height:24px}
.hint.error{color:var(--fg)}
.done{margin:0;display:flex;align-items:center;gap:12px;font-size:17px;line-height:26px;font-weight:600}
html[dir=rtl] .done{font-weight:500}

.foot{position:absolute;inset-inline:48px;inset-block-end:36px;display:flex;justify-content:flex-end;align-items:center;z-index:3}
.foot-end{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.toggle{min-height:44px;padding:0 16px;border:1px solid var(--sub);border-radius:0;background:transparent;color:var(--fg);font-family:"Readex Pro",Geist,sans-serif;font-size:15px;cursor:pointer;transition:border-color 160ms cubic-bezier(.2,0,0,1)}
.toggle:hover{border-color:var(--fg)}
.toggle:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.toggle-en{font-family:Geist,system-ui,sans-serif}

.up{animation:up 500ms cubic-bezier(.2,0,0,1) both}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.fade{animation:fade 400ms linear both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.root .d1{animation-delay:200ms}
.root .d2{animation-delay:380ms}
.root .d3{animation-delay:460ms}
.root .d4{animation-delay:620ms}
.root .d5{animation-delay:720ms}
.root .d6{animation-delay:900ms}

@media (min-width:1181px) and (max-height:820px){.stage{--fs:.82}}
@media (min-width:1181px) and (max-height:700px){.stage{--fs:.7}}
@media (max-width:1180px){
.root{height:auto;min-height:100vh;padding:32px 40px;display:flex;flex-direction:column}
.head{position:relative;inset:auto}
.stage{position:relative;inset:auto;height:560px;--fs:.78}
.bottom{position:relative;inset:auto;flex-wrap:wrap}
.foot{position:relative;inset:auto;margin-top:56px}
}
@media (max-width:760px){
.root{padding:24px 20px 28px}
.head{flex-direction:column;gap:20px}
.stage{height:380px;--fs:.5}
.bottom{flex-direction:column;align-items:stretch;gap:32px}
.side{width:auto}
.foot{justify-content:flex-start;margin-top:48px}
}
@media (prefers-reduced-motion:reduce){
*,*::before{animation:none !important;transition:none !important}
}
</style>
</head>
<body>
<div class="root">

<header class="head">
<div class="brand">
<img class="logo" data-lang="en" src="/assets/leyxo-lockup-horizontal-reversed.svg" alt="Leyxo Studio" width="130" height="30">
<img class="logo logo-ar" data-lang="ar" hidden src="/assets/leyxo-lockup-signage-reversed.svg" alt="ليكسو ستوديو، Leyxo Studio" width="138" height="52">
</div>
</header>

<div class="stage" aria-hidden="true">
<div class="scale">
<div class="group" data-group>
<div class="card" style="--i:0"><img src="/assets/cards/card-01-photo-material-violet-light.jpg" alt="" width="520" height="520" draggable="false"></div>
<div class="card" style="--i:1"><img src="/assets/cards/card-02-mockup-business-cards.jpg" alt="" width="520" height="520" draggable="false"></div>
<div class="card" style="--i:2"><img src="/assets/cards/card-03-photo-portrait-producer.jpg" alt="" width="520" height="520" draggable="false"></div>
<div class="card" style="--i:3"><img src="/assets/cards/card-04-mockup-website-laptop.jpg" alt="" width="520" height="520" draggable="false"></div>
<div class="card" style="--i:4"><img src="/assets/cards/card-05-photo-architecture-cut-shadow.jpg" alt="" width="520" height="520" draggable="false"></div>
<div class="card" style="--i:5"><img src="/assets/cards/card-06-mockup-instagram-phone.jpg" alt="" width="520" height="520" draggable="false"></div>
<div class="card" style="--i:6"><img src="/assets/cards/card-07-photo-food-hard-key.jpg" alt="" width="520" height="520" draggable="false"></div>
<div class="card" style="--i:7"><img src="/assets/cards/card-08-mockup-mug-notebook.jpg" alt="" width="520" height="520" draggable="false"></div>
<div class="card" style="--i:8"><img src="/assets/cards/card-09-photo-deboss-monogram.jpg" alt="" width="520" height="520" draggable="false"></div>
<div class="card" style="--i:9"><img src="/assets/cards/card-10-mockup-reception-sign-halo.jpg" alt="" width="520" height="520" draggable="false"></div>
<div class="card" style="--i:10"><img src="/assets/cards/card-11-photo-fintech-editorial.jpg" alt="" width="520" height="520" draggable="false"></div>
<div class="card" style="--i:11"><img src="/assets/cards/card-12-mockup-tote.jpg" alt="" width="520" height="520" draggable="false"></div>
<div class="card" style="--i:12"><img src="/assets/cards/card-13-photo-portrait-director.jpg" alt="" width="520" height="520" draggable="false"></div>
<div class="card" style="--i:13"><img src="/assets/cards/card-14-mockup-client-delivery-kit.jpg" alt="" width="520" height="520" draggable="false"></div>
<div class="card" style="--i:14"><img src="/assets/cards/card-15-photo-studio-night.jpg" alt="" width="520" height="520" draggable="false"></div>
</div>
</div>
</div>

<main class="bottom">
<div class="title">
<h1 class="h1" data-lang="en"><span class="line"><span class="d2">Polish</span></span><span class="line"><span class="d3">at speed.</span></span></h1>
<h1 class="h1" data-lang="ar" hidden><span class="line"><span class="d2">إتقان</span></span><span class="line"><span class="d3">بسرعة.</span></span></h1>
</div>
<div class="side up d4">
<div data-lang="en">
<form class="form" novalidate data-form>
<label for="email-en" class="mono">WORK EMAIL</label>
<div class="row">
<input id="email-en" class="input" type="email" inputmode="email" autocomplete="email" dir="ltr" placeholder="name@company.com" aria-describedby="hint-en" required>

</div>

</div>

</div>
<p id="hint-ar" class="hint" data-hint data-ok="رسالة واحدة عند الإطلاق، لا أكثر." data-err="أدخل عنوان بريد إلكتروني كاملاً، مثل name@company.com." aria-live="polite">رسالة واحدة عند الإطلاق، لا أكثر.</p>
</form>
<p class="done" role="status" data-done hidden><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>أنت على القائمة. رسالة واحدة عند الإطلاق.</p>

<footer class="foot fade d6">
<div class="foot-end">
<span class="mono sub" data-lang="en">© 2026 LEYXO STUDIO</span>
<button type="button" class="toggle" data-lang="en" lang="ar" data-toggle-lang>العربية</button>
<span class="mono sub" data-lang="ar" hidden>© 2026 ليكسو ستوديو</span>
<button type="button" class="toggle toggle-en" data-lang="ar" hidden lang="en" data-toggle-lang>English</button>
</div>
</footer>

</div>
<script>
(function () {
  var root = document.documentElement, KEY = 'leyxo-lang';
  var reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  var titles = { en: 'Leyxo Studio · Coming soon', ar: 'ليكسو ستوديو · قريباً' };

  /* Language */
  function setLang(l, animate) {
    root.lang = l; root.dir = l === 'ar' ? 'rtl' : 'ltr'; document.title = titles[l];
    var els = document.querySelectorAll('[data-lang]');
    for (var i = 0; i < els.length; i++) els[i].hidden = els[i].getAttribute('data-lang') !== l;
    try { localStorage.setItem(KEY, l); } catch (e) {}
  }
  var start = 'en';
  try {
    var q = new URLSearchParams(location.search).get('lang');
    var saved = localStorage.getItem(KEY);
    start = (q === 'ar' || q === 'en') ? q : (saved === 'ar' ? 'ar' : 'en');
  } catch (e) {}
  setLang(start, true);
  var toggles = document.querySelectorAll('[data-toggle-lang]');
  for (var t = 0; t < toggles.length; t++) toggles[t].addEventListener('click', function () {
    setLang(root.lang === 'ar' ? 'en' : 'ar', true);
    var next = document.querySelector('[data-toggle-lang]:not([hidden])'); if (next) next.focus();
  });

  /* Waitlist form: opens an email to hello@leyxo.com */
  var forms = document.querySelectorAll('[data-form]');
  for (var f = 0; f < forms.length; f++) (function (form) {
    var input = form.querySelector('input'), hint = form.querySelector('[data-hint]');
    var done = form.parentNode.querySelector('[data-done]');
    input.addEventListener('input', function () {
      input.removeAttribute('aria-invalid'); hint.classList.remove('error'); hint.textContent = hint.getAttribute('data-ok');
    });
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var v = input.value.trim();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) {
        input.setAttribute('aria-invalid', 'true'); hint.classList.add('error'); hint.textContent = hint.getAttribute('data-err'); input.focus();
        return;
      }
      var subject = encodeURIComponent('Notify me when Leyxo launches');
      var body = encodeURIComponent('Please add me to the Leyxo launch list: ' + v);
      window.location.href = 'mailto:hello@leyxo.com?subject=' + subject + '&body=' + body;
      form.hidden = true; done.hidden = false;
    });
  })(forms[f]);

  /* Spinning gallery */
  var group = document.querySelector('[data-group]');
  if (!group) return;
  var BASE = 0.009; /* degrees per ms, 9 degrees per second */
  var angle = -36, boost = reduce ? 0 : 0.3, tilt = 48, ry = 0, px = 0, py = 0;
  var t0 = performance.now(), last = t0, touchY = null;
  function clamp(v) { return Math.max(-0.5, Math.min(0.5, v)); }
  function loop(now) {
    requestAnimationFrame(loop);
    var dt = now - last; last = now;
    if (dt > 64) dt = 64; if (dt < 0) dt = 0;
    var fr = dt / 16.667;
    boost *= Math.pow(0.95, fr);
    if (Math.abs(boost) < 0.00005) boost = 0;
    var vel = reduce ? 0 : BASE + boost;
    angle = (angle + vel * dt) % 360;
    var k = 1 - Math.pow(0.9, fr);
    tilt += ((48 - py * 8) - tilt) * k;
    ry += ((px * 10) - ry) * k;
    var ip = reduce ? 1 : Math.min(1, (now - t0) / 1100);
    var sc = 0.84 + 0.16 * (1 - Math.pow(1 - ip, 3));
    group.style.transform = 'rotateY(' + ry.toFixed(3) + 'deg) rotateX(' + tilt.toFixed(3) + 'deg) rotateZ(' + angle.toFixed(3) + 'deg) scale(' + sc.toFixed(4) + ')';
  }
  requestAnimationFrame(loop);
  setTimeout(function () { group.classList.add('open'); }, reduce ? 0 : 250);
  if (!reduce) {
    window.addEventListener('wheel', function (e) {
      if (e.ctrlKey) return;
      var d = e.deltaY;
      if (e.deltaMode === 1) d *= 16; else if (e.deltaMode === 2) d *= 400;
      boost = clamp(boost + d * 0.0011);
    }, { passive: true });
    window.addEventListener('touchstart', function (e) { var t = e.touches && e.touches[0]; touchY = t ? t.clientY : null; }, { passive: true });
    window.addEventListener('touchmove', function (e) {
      var t = e.touches && e.touches[0];
      if (!t || touchY === null) return;
      var d = touchY - t.clientY; touchY = t.clientY;
      boost = clamp(boost + d * 0.003);
    }, { passive: true });
  }
  window.addEventListener('pointermove', function (e) {
    if (e.pointerType && e.pointerType !== 'mouse') return;
    px = e.clientX / Math.max(1, window.innerWidth) - 0.5;
    py = e.clientY / Math.max(1, window.innerHeight) - 0.5;
  }, { passive: true });
  document.addEventListener('mouseout', function (e) { if (!e.relatedTarget) { px = 0; py = 0; } });
})();
</script>
</body>
</html>
