<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leyxo · Coming soon</title>
<meta name="description" content="Leyxo is a full-stack marketing and media agency for every kind of business. Brands that wink back. Launching soon.">
<meta name="theme-color" content="#D4FF24">
<meta name="color-scheme" content="light">
<link rel="canonical" href="https://leyxo.com/">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:url" content="https://leyxo.com/">
<meta property="og:site_name" content="Leyxo">
<meta property="og:title" content="Leyxo · Brands that wink back.">
<meta property="og:description" content="Full-stack marketing and media agency for every kind of business. Launching soon.">
<meta property="og:image" content="https://leyxo.com/assets/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Instrument+Sans:wght@400;600&family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap">
<script>document.documentElement.className += ' js';</script>
<style>
/* Leyxo, The Wink: lime ground, midnight type, cobalt wink. */
:root{--lime:#D4FF24;--cobalt:#1558C9;--midnight:#030407;--paper:#F3F4EF;--sky:#C9DAF8;--muted:#5B6170;
--display:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;--text:"Instrument Sans","Baloo Bhaijaan 2",system-ui,sans-serif;--arabic:"Baloo Bhaijaan 2","Instrument Sans",system-ui,sans-serif}
[hidden]{display:none !important}
html,body{overscroll-behavior:none}
html{background:var(--lime)}
body{margin:0;background:var(--lime);color:var(--midnight);font-family:var(--text);-webkit-font-smoothing:antialiased;font-synthesis:none}
html[dir=rtl] body{font-family:var(--arabic)}
a{color:var(--midnight)}
a:hover{color:var(--cobalt)}
.label{margin:0;font-size:13px;line-height:16px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
html[dir=rtl] .label{font-size:15px;line-height:22px;font-weight:700;letter-spacing:0;text-transform:none}

.root{position:relative;height:100vh;height:100dvh;min-height:680px;overflow:hidden;box-sizing:border-box}

.head{position:absolute;inset-block-start:calc(40px + env(safe-area-inset-top,0px));inset-inline:48px;display:flex;justify-content:space-between;align-items:center;gap:24px;z-index:3}
.logo{display:block;width:156px;height:auto;animation:fade 500ms linear 120ms both}
.face{display:block;width:76px;height:auto;animation:wink 900ms cubic-bezier(.2,0,0,1) 700ms both}
@keyframes wink{0%{transform:scale(.6) rotate(-12deg);opacity:0}60%{transform:scale(1.08) rotate(4deg);opacity:1}100%{transform:none;opacity:1}}

.stage{--fs:.9;position:absolute;inset:0 0 150px 0;perspective:3000px;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:1}
.scale{position:relative;width:0;height:0;transform-style:preserve-3d;transform:scale(var(--fs))}
.group{position:relative;width:0;height:0;transform-style:preserve-3d;transform:rotateX(48deg)}
.card{position:absolute;left:0;top:0;width:300px;height:240px;overflow:hidden;border-radius:16px;background:var(--paper);transform:translate(-50%,-50%) rotateZ(calc(var(--i) * 25.714deg)) translate3d(0,-160px,0) rotateY(90deg) scale(1);opacity:1;transition:transform 600ms cubic-bezier(.2,0,0,1),opacity 300ms linear;transition-delay:calc(var(--i) * 40ms)}
.js .group:not(.open) .card{transform:translate(-50%,-50%) rotateZ(0deg) translate3d(0,-160px,0) rotateY(90deg) scale(.6);opacity:0}
.card img{position:absolute;left:30px;top:-30px;display:block;width:240px;height:300px;object-fit:cover;transform:rotate(270deg) scale(1.02);user-select:none;-webkit-user-drag:none}

.bottom{position:absolute;inset-inline:48px;inset-block-end:104px;display:flex;justify-content:space-between;align-items:flex-end;gap:40px;z-index:3}
.title{display:flex;flex-direction:column;align-items:flex-start;gap:20px;min-width:0}
.pill{display:inline-flex;align-items:center;gap:8px;min-height:32px;padding:0 14px;border-radius:999px;background:var(--cobalt);color:var(--paper)}
.dot{width:8px;height:8px;border-radius:999px;background:var(--lime)}
.h1{margin:0;font-family:var(--display);font-size:clamp(52px,6.4vw,104px);line-height:.95;font-weight:800;letter-spacing:-0.025em;font-optical-sizing:auto}
html[dir=rtl] .h1{font-family:var(--arabic);font-size:clamp(48px,6.2vw,96px);line-height:1.2;letter-spacing:0}
.line{display:block;overflow:hidden;padding-bottom:.12em;margin-bottom:-.12em}
.line > span{display:block;animation:rise 600ms cubic-bezier(.2,0,0,1) both}
@keyframes rise{from{transform:translateY(105%)}to{transform:none}}

.side{width:clamp(320px,26vw,400px)}
.form{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px}
.input{flex:1 1 180px;min-width:0;height:56px;box-sizing:border-box;padding:0 16px;border:2px solid var(--midnight);border-radius:8px;background:var(--paper);color:var(--midnight);font:inherit;font-size:16px;transition:border-color 160ms cubic-bezier(.2,0,0,1)}
.input::placeholder{color:var(--muted)}
.input:hover{border-color:var(--cobalt)}
.input:focus{outline:3px solid var(--cobalt);outline-offset:2px}
.btn{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;gap:10px;height:56px;padding:0 22px 0 24px;border:0;border-radius:999px;background:var(--cobalt);color:var(--paper);font-family:var(--text);font-size:16px;font-weight:600;cursor:pointer;transition:background-color 200ms cubic-bezier(.2,0,0,1),color 200ms cubic-bezier(.2,0,0,1)}
html[dir=rtl] .btn{font-family:var(--arabic);font-size:17px;font-weight:700;padding:0 24px 0 22px}
.btn:hover,.btn:focus-visible{background:var(--midnight);color:var(--lime)}
.btn:focus-visible{outline:3px solid var(--midnight);outline-offset:2px}
.arrow{transition:transform 260ms cubic-bezier(.2,0,0,1)}
.btn:hover .arrow,.btn:focus-visible .arrow{transform:translateX(4px)}
html[dir=rtl] .arrow{transform:scaleX(-1)}
html[dir=rtl] .btn:hover .arrow,html[dir=rtl] .btn:focus-visible .arrow{transform:scaleX(-1) translateX(4px)}
.hint{margin:0;font-size:15px;line-height:22px}
html[dir=rtl] .hint{font-size:16px;line-height:26px}
.hint.error{font-weight:600}
.done{margin:0;padding:16px 20px;border-radius:16px;background:var(--cobalt);color:var(--paper);font-size:18px;line-height:26px;font-weight:600}

.foot{position:absolute;inset-inline:48px;inset-block-end:calc(32px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;z-index:3}
.toggle{min-height:44px;padding:0 20px;border:2px solid var(--midnight);border-radius:999px;background:transparent;color:var(--midnight);font-family:var(--arabic);font-size:16px;font-weight:700;cursor:pointer;transition:background-color 160ms cubic-bezier(.2,0,0,1),color 160ms cubic-bezier(.2,0,0,1)}
.toggle:hover{background:var(--midnight);color:var(--lime)}
.toggle:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
.toggle-en{font-family:var(--text);font-weight:600}

.up{animation:up 500ms cubic-bezier(.2,0,0,1) both}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.fade{animation:fade 400ms linear both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.d1{animation-delay:200ms}.d2{animation-delay:380ms}.d3{animation-delay:460ms}.d4{animation-delay:620ms}.d6{animation-delay:900ms}

@media (min-width:1181px) and (max-height:820px){.stage{--fs:.76}}
@media (min-width:1181px) and (max-height:700px){.stage{--fs:.62}}
@media (max-width:1180px){
.root{height:auto;min-height:100vh;min-height:100dvh;padding:32px 40px;display:flex;flex-direction:column}
.head{position:relative;inset:auto}
.stage{position:relative;inset:auto;height:560px;--fs:.78}
.bottom{position:relative;inset:auto;flex-wrap:wrap}
.foot{position:relative;inset:auto;margin-top:56px}
}
@media (max-width:760px){
.root{padding:24px max(20px,env(safe-area-inset-right,0px)) 28px max(20px,env(safe-area-inset-left,0px))}
.logo{width:120px}
.face{width:60px}
.stage{height:380px;--fs:.5}
.bottom{flex-direction:column;align-items:stretch;gap:32px}
.side{width:auto}
.row{flex-wrap:wrap}
.btn{flex:1 1 100%}
.foot{margin-top:48px}
}
@media (prefers-reduced-motion:reduce){
*,*::before{animation:none !important;transition:none !important}
}
</style>
</head>
<body>
<div class="root">

<header class="head">
<img class="logo" src="/assets/leyxo-logo-primary.svg" alt="Leyxo" width="156" height="65">
<img class="face" src="/assets/leyxo-face-wink-cobalt.svg" alt="" width="76" height="48" data-face>
</header>

<div class="stage" aria-hidden="true">
<div class="scale">
<div class="group" data-group>
<div class="card" style="--i:0"><img src="/assets/cards/spin_pattern_cobalt.svg" alt="" draggable="false"></div>
<div class="card" style="--i:1"><img src="/assets/cards/spin_o_midnight.svg" alt="" draggable="false"></div>
<div class="card" style="--i:2"><img src="/assets/cards/spin_pattern_paper.svg" alt="" draggable="false"></div>
<div class="card" style="--i:3"><img src="/assets/cards/spin_x_sky.svg" alt="" draggable="false"></div>
<div class="card" style="--i:4"><img src="/assets/cards/spin_pattern_midnight.svg" alt="" draggable="false"></div>
<div class="card" style="--i:5"><img src="/assets/cards/spin_o_paper.svg" alt="" draggable="false"></div>
<div class="card" style="--i:6"><img src="/assets/cards/spin_x_cobalt.svg" alt="" draggable="false"></div>
<div class="card" style="--i:7"><img src="/assets/cards/spin_pattern_cobalt.svg" alt="" draggable="false"></div>
<div class="card" style="--i:8"><img src="/assets/cards/spin_o_midnight.svg" alt="" draggable="false"></div>
<div class="card" style="--i:9"><img src="/assets/cards/spin_pattern_paper.svg" alt="" draggable="false"></div>
<div class="card" style="--i:10"><img src="/assets/cards/spin_x_sky.svg" alt="" draggable="false"></div>
<div class="card" style="--i:11"><img src="/assets/cards/spin_pattern_midnight.svg" alt="" draggable="false"></div>
<div class="card" style="--i:12"><img src="/assets/cards/spin_o_paper.svg" alt="" draggable="false"></div>
<div class="card" style="--i:13"><img src="/assets/cards/spin_x_cobalt.svg" alt="" draggable="false"></div>
</div>
</div>
</div>

<main class="bottom">
<div>
<div data-lang="en" class="title">
<span class="pill label up d1"><span class="dot" aria-hidden="true"></span>Coming soon</span>
<h1 class="h1"><span class="line"><span class="d2">Brands that</span></span><span class="line"><span class="d3">wink back.</span></span></h1>
</div>
<div data-lang="ar" class="title" hidden>
<span class="pill label up d1"><span class="dot" aria-hidden="true"></span>قريباً</span>
<h1 class="h1"><span class="line"><span class="d2">علامات تجارية</span></span><span class="line"><span class="d3">تبادلك الغمزة.</span></span></h1>
</div>
</div>
<div class="side up d4">
<div data-lang="en">
<form class="form" novalidate data-form>
<label for="email-en" class="label">Work email</label>
<div class="row">
<input id="email-en" class="input" type="email" inputmode="email" autocomplete="email" dir="ltr" placeholder="name@company.com" aria-describedby="hint-en" required>
<button type="submit" class="btn">Notify me<svg class="arrow" width="20" height="20" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 24h28M26 12l12 12-12 12"/></svg></button>
</div>
<p id="hint-en" class="hint" data-hint data-ok="One email when we launch. Nothing else." data-err="Enter a full email address, like name@company.com." aria-live="polite">One email when we launch. Nothing else.</p>
</form>
<p class="done" role="status" data-done hidden>You're on the list. One email, at launch. Like so.</p>
</div>
<div data-lang="ar" hidden>
<form class="form" novalidate data-form>
<label for="email-ar" class="label">البريد الإلكتروني للعمل</label>
<div class="row">
<input id="email-ar" class="input" type="email" inputmode="email" autocomplete="email" dir="ltr" placeholder="name@company.com" aria-describedby="hint-ar" required>
<button type="submit" class="btn">أبلغني<svg class="arrow" width="20" height="20" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 24h28M26 12l12 12-12 12"/></svg></button>
</div>
<p id="hint-ar" class="hint" data-hint data-ok="رسالة واحدة عند الإطلاق، لا أكثر." data-err="أدخل عنوان بريد إلكتروني كاملاً، مثل name@company.com." aria-live="polite">رسالة واحدة عند الإطلاق، لا أكثر.</p>
</form>
<p class="done" role="status" data-done hidden>أنت على القائمة. رسالة واحدة عند الإطلاق.</p>
</div>
</div>
</main>

<footer class="foot fade d6">
<span class="label" data-lang="en">© 2026 Leyxo</span>
<button type="button" class="toggle" data-lang="en" lang="ar" data-toggle-lang>العربية</button>
<span class="label" data-lang="ar" hidden>© 2026 ليكسو</span>
<button type="button" class="toggle toggle-en" data-lang="ar" hidden lang="en" data-toggle-lang>English</button>
</footer>

</div>
<script>
(function () {
  var root = document.documentElement, KEY = 'leyxo-lang';
  var reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  var titles = { en: 'Leyxo · Coming soon', ar: 'ليكسو · قريباً' };
  var face = document.querySelector('[data-face]');

  /* Language */
  function setLang(l) {
    root.lang = l; root.dir = l === 'ar' ? 'rtl' : 'ltr'; document.title = titles[l];
    var els = document.querySelectorAll('[data-lang]');
    for (var i = 0; i < els.length; i++) els[i].hidden = els[i].getAttribute('data-lang') !== l;
    try { localStorage.setItem(KEY, l); } catch (e) {}
  }
  var start = 'en';
  try {
    var q = new URLSearchParams(location.search).get('lang');
    var saved = localStorage.getItem(KEY);
    start = (q === 'ar' || q === 'en') ? q : (saved === 'ar' ? 'ar' : 'en');
  } catch (e) {}
  setLang(start);
  var toggles = document.querySelectorAll('[data-toggle-lang]');
  for (var t = 0; t < toggles.length; t++) toggles[t].addEventListener('click', function () {
    setLang(root.lang === 'ar' ? 'en' : 'ar');
    var next = document.querySelector('[data-toggle-lang]:not([hidden])'); if (next) next.focus();
  });

  /* Waitlist form: opens an email to hello@leyxo.com */
  var forms = document.querySelectorAll('[data-form]');
  for (var f = 0; f < forms.length; f++) (function (form) {
    var input = form.querySelector('input'), hint = form.querySelector('[data-hint]');
    var done = form.parentNode.querySelector('[data-done]');
    input.addEventListener('input', function () {
      input.removeAttribute('aria-invalid'); hint.classList.remove('error'); hint.textContent = hint.getAttribute('data-ok');
    });
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var v = input.value.trim();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) {
        input.setAttribute('aria-invalid', 'true'); hint.classList.add('error'); hint.textContent = hint.getAttribute('data-err'); input.focus();
        return;
      }
      var subject = encodeURIComponent('Notify me when Leyxo launches');
      var body = encodeURIComponent('Please add me to the Leyxo launch list: ' + v);
      window.location.href = 'mailto:hello@leyxo.com?subject=' + subject + '&body=' + body;
      form.hidden = true; done.hidden = false;
      if (face) face.src = '/assets/leyxo-face-grin-cobalt.svg';
    });
  })(forms[f]);

  /* Spinning gallery */
  var group = document.querySelector('[data-group]');
  if (!group) return;
  var BASE = 0.009; /* degrees per ms, 9 degrees per second */
  var angle = -36, boost = reduce ? 0 : 0.3, tilt = 48, ry = 0, px = 0, py = 0;
  var t0 = performance.now(), last = t0, touchY = null;
  function clamp(v) { return Math.max(-0.5, Math.min(0.5, v)); }
  function loop(now) {
    requestAnimationFrame(loop);
    var dt = now - last; last = now;
    if (dt > 64) dt = 64; if (dt < 0) dt = 0;
    var fr = dt / 16.667;
    boost *= Math.pow(0.95, fr);
    if (Math.abs(boost) < 0.00005) boost = 0;
    var vel = reduce ? 0 : BASE + boost;
    angle = (angle + vel * dt) % 360;
    var k = 1 - Math.pow(0.9, fr);
    tilt += ((48 - py * 8) - tilt) * k;
    ry += ((px * 10) - ry) * k;
    var ip = reduce ? 1 : Math.min(1, (now - t0) / 1100);
    var sc = 0.84 + 0.16 * (1 - Math.pow(1 - ip, 3));
    group.style.transform = 'rotateY(' + ry.toFixed(3) + 'deg) rotateX(' + tilt.toFixed(3) + 'deg) rotateZ(' + angle.toFixed(3) + 'deg) scale(' + sc.toFixed(4) + ')';
  }
  requestAnimationFrame(loop);
  setTimeout(function () { group.classList.add('open'); }, reduce ? 0 : 250);
  if (!reduce) {
    window.addEventListener('wheel', function (e) {
      if (e.ctrlKey) return;
      var d = e.deltaY;
      if (e.deltaMode === 1) d *= 16; else if (e.deltaMode === 2) d *= 400;
      boost = clamp(boost + d * 0.0011);
    }, { passive: true });
    window.addEventListener('touchstart', function (e) { var t = e.touches && e.touches[0]; touchY = t ? t.clientY : null; }, { passive: true });
    window.addEventListener('touchmove', function (e) {
      var t = e.touches && e.touches[0];
      if (!t || touchY === null) return;
      var d = touchY - t.clientY; touchY = t.clientY;
      boost = clamp(boost + d * 0.003);
    }, { passive: true });
  }
  window.addEventListener('pointermove', function (e) {
    if (e.pointerType && e.pointerType !== 'mouse') return;
    px = e.clientX / Math.max(1, window.innerWidth) - 0.5;
    py = e.clientY / Math.max(1, window.innerHeight) - 0.5;
  }, { passive: true });
  document.addEventListener('mouseout', function (e) { if (!e.relatedTarget) { px = 0; py = 0; } });
})();
</script>
</body>
</html>
